<!doctype html>
<script type="application/json" id="cowork-artifact-meta">

  "name": "Aap Study Dashboard",
  "schemaVersion": 1,
  "description": "AAP Study Dashboard — pastel-themed tracker for the full certification. Top: overall-program ring + per-track rings (Modules 301–326, Vedic Formulations, Ashtanga Hridayam, Sanskrit, Internship) with expandable track bars. Nested dropdowns: 26 modules (302 & 303 detailed, each with Readings/Recordings/Slides/Test bars), Formulations (71 classes, PDF+recording, per-part class bars), Sanskrit (15 monthly classes, PDF+recording), Ashtanga Hridayam (weekly rec/live Aug 2026–May 2029 with per-part bars), and the 505-hr internship/trip plan. Progress saves in localStorage."

</script>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AAP — Study Dashboard</title>
<style>
:root{
  color-scheme: light;
  --bg:#f3f1fa; --card:#ffffff; --card2:#faf8fd; --line:#ece7f2;
  --ink:#403b52; --mut:#8c869c; --mut2:#b0aabf;
  --tw:#ece7f2;                         /* ring / bar well */
  --lav:#a99bd6; --mint:#79c6a6; --peach:#f1a988; --sky:#8ec2e8;
  --rose:#e9a1c1; --butter:#e6c983; --sage:#9ac795; --teal:#7cc4c0;
  --shadow:0 1px 3px rgba(90,70,130,.06),0 8px 24px rgba(90,70,130,.06);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16.9px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:100%;width:100%;margin:0 auto;padding:26px clamp(14px,3vw,44px) 90px}
h1{font-size:31.6px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:16.4px;margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.pad{padding:22px 24px}
.section{margin-top:16px}

/* master overview */
.ov-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ov-title{font-weight:700;font-size:19.6px}
.ov-note{color:var(--mut);font-size:14.7px}
.ov-grid{display:flex;gap:22px;align-items:center;flex-wrap:nowrap;justify-content:center}
.ov-big{flex:0 0 auto}
.rings{display:flex;flex-wrap:nowrap;gap:12px;justify-content:space-between;flex:1 1 auto}
.ring{text-align:center;padding:4px 2px}
.ring svg{display:block;margin:0 auto 7px}
.ring .rv{font-weight:700;fill:var(--ink)}
.ring .rp{fill:var(--mut2)}
.ring .lab{font-size:14.2px;font-weight:700;color:var(--ink);letter-spacing:.01em}
.ring .cnt{font-size:13.1px;color:var(--mut)}
.ov-big .lab{font-size:15.8px}
details.bars{margin-top:18px;border-top:1px dashed var(--line);padding-top:14px}
details.bars>summary{cursor:pointer;color:var(--lav);font-weight:700;font-size:14.7px;list-style:none}
details.bars>summary::-webkit-details-marker{display:none}
details.bars>summary::before{content:"▸ ";color:var(--mut2)}
details.bars[open]>summary::before{content:"▾ "}
.bar-row{display:grid;grid-template-columns:170px 1fr 150px;gap:12px;align-items:center;margin:11px 0}
.bar-row .bl{font-size:15.3px;font-weight:600}
.bar-row .bc{font-size:13.6px;color:var(--mut);text-align:right}
.track{height:11px;background:var(--tw);border-radius:7px;overflow:hidden}
.fill{height:100%;border-radius:7px;transition:width .35s ease}

/* section dropdowns */
details.sec{margin-top:15px}
details.sec>summary{cursor:pointer;list-style:none;padding:17px 20px;background:var(--card);
  border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:13px}
details.sec[open]>summary{border-radius:14px 14px 0 0;border-bottom:none}
details.sec>summary::-webkit-details-marker{display:none}
.sec-caret{color:var(--lav);font-size:15.3px;transition:transform .2s}
details.sec[open] .sec-caret{transform:rotate(90deg)}
.sec-name{font-weight:700;font-size:19.1px}
.sec-bar{flex:0 1 210px;min-width:90px;margin-left:auto}
.sec-bar .track{height:10px}
.sec-meta{color:var(--mut);font-size:14.2px;text-align:right;flex:none;min-width:96px}
.sec-body{border:1px solid var(--line);border-top:none;border-radius:0 0 14px 14px;
  background:var(--card);padding:8px 16px 16px}

/* module */
details.mod{border-bottom:1px solid var(--line)}
details.mod:last-child{border-bottom:none}
details.mod>summary{cursor:pointer;list-style:none;padding:14px 6px;display:flex;gap:13px;align-items:flex-start}
details.mod>summary::-webkit-details-marker{display:none}
.mc{font-weight:700;font-size:16.9px;color:var(--lav);white-space:nowrap}
.mt{font-weight:600;font-size:16.4px}
.md{color:var(--mut);font-size:14.2px;margin-top:2px}
.mcaret{color:var(--mut2);font-size:14.2px;margin-top:3px;transition:transform .2s}
details.mod[open] .mcaret{transform:rotate(90deg)}
.pill{font-size:12px;font-weight:700;letter-spacing:.03em;padding:3px 10px;border-radius:20px;
  text-transform:uppercase;white-space:nowrap}
.pill.done{background:#e2f3ea;color:#3f8a68}
.pill.active{background:#fdeede;color:#c07f3a}
.pill.todo{background:#efecf5;color:var(--mut)}
.mini-wrap{display:flex;flex-wrap:wrap;gap:16px;margin:6px 0 4px}
.mini{flex:1 1 130px;min-width:130px}
.mini .ml{display:flex;justify-content:space-between;font-size:13.1px;color:var(--mut);margin-bottom:4px}
.mini .ml b{color:var(--ink);font-weight:600}
.mini .track{height:8px}
.mod-inner{padding:4px 4px 12px}
.plan-note{color:var(--mut);font-size:14.7px;font-style:italic;padding:9px 2px}

/* sessions */
.ses{padding:12px 0;border-top:1px solid var(--line)}
.ses:first-child{border-top:none}
.ses-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.ses-date{font-weight:700;font-size:14.7px}
.ses-title{font-size:14.7px;color:#5b556b}
.ses-pp{font-size:12.5px;color:var(--mut);background:var(--card2);border:1px solid var(--line);
  border-radius:20px;padding:1px 9px;margin-left:auto}
.item{display:flex;gap:10px;align-items:flex-start;padding:4px 0 4px 4px}
.tag{font-size:10.9px;font-weight:700;letter-spacing:.05em;color:var(--mut2);
  width:62px;flex:none;padding-top:2px;text-transform:uppercase}
.tag.read{color:#bf9a3f}.tag.lecture{color:#d38a63}.tag.slides{color:#5c9fce}
.tag.test{color:#4aa079}.tag.prep{color:var(--mut)}
.itx{font-size:14.7px}
label.ck{display:flex;gap:10px;align-items:flex-start;cursor:pointer;flex:1}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:17px;height:17px;flex:none;
  border:1.8px solid var(--mut2);border-radius:5px;margin:1px 0 0;cursor:pointer;position:relative;background:#fff}
input[type=checkbox]:checked{background:var(--mint);border-color:var(--mint)}
input[type=checkbox]:checked::after{content:"";position:absolute;left:5px;top:1px;width:4px;height:9px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.done-row .itx,.done-row .tag{text-decoration:line-through;opacity:.5}

/* sub dropdowns (formulations / sanskrit / ah) */
details.sub{border-bottom:1px solid var(--line)}
details.sub:last-child{border-bottom:none}
details.sub>summary{cursor:pointer;list-style:none;padding:12px 4px;display:flex;gap:12px;align-items:center}
details.sub>summary::-webkit-details-marker{display:none}
.subcaret{color:var(--mut2);font-size:13.1px;transition:transform .2s;flex:none}
details.sub[open] .subcaret{transform:rotate(90deg)}
.sub-name{font-weight:700;font-size:15.8px;white-space:nowrap}
.sub-meta{margin-left:auto;color:var(--mut);font-size:13.6px}
.sub-bar{flex:1;max-width:420px;margin-left:12px}

/* progress bars (parts) */
.pbar{display:grid;grid-template-columns:66px 1fr 46px;gap:10px;align-items:center;margin:6px 0}
.pbar.nolabel{grid-template-columns:1fr 46px}
.pbl{font-size:14.2px;color:var(--mut);font-weight:600}
.pbc{font-size:13.6px;color:var(--mut);text-align:right}
.pbar .track{height:9px}
.pbar-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:8px 2px 14px}
.pbar-head{font-weight:700;font-size:14.7px;margin-bottom:6px;color:var(--ink)}
.san-bar{padding:6px 2px 12px;max-width:520px}

/* formulation / sanskrit rows */
.frow{display:grid;grid-template-columns:150px 1fr auto;gap:12px;align-items:center;
  padding:9px 4px;border-top:1px solid var(--line)}
.frow .fd{font-size:13.6px;color:var(--mut)}
.frow .ft{font-size:14.7px}.frow .ft b{font-weight:700;margin-right:6px}
.frow.fdone .ft{opacity:.55}.frow.fdone .ft b{text-decoration:line-through}
.fboxes{display:flex;gap:16px;flex-wrap:wrap}
.fbox{display:flex;gap:7px;align-items:center;font-size:13.6px;color:var(--mut)}

/* assignment rows */
.arow{display:grid;grid-template-columns:118px 1fr;gap:14px;align-items:center;
  padding:9px 4px;border-top:1px solid var(--line)}
.arow .al{font-size:14.7px}.arow .al b{font-weight:700}
.arow.asubmit{background:var(--card2);border-radius:9px;margin-top:6px;padding:10px 8px;border-top:none}
.arow.asubmit .al b{color:var(--sage)}
.arow.arowdone .al{opacity:.55}.arow.arowdone .al b{text-decoration:line-through}

/* AH weeks */
.week{padding:10px 4px;border-top:1px solid var(--line);display:grid;
  grid-template-columns:104px 1fr;gap:12px;align-items:start}
.week .wl{font-size:13.6px;color:var(--mut);padding-top:2px}
.witems{display:flex;flex-direction:column;gap:6px}
.witem{display:flex;gap:9px;align-items:flex-start}
.wtag{font-size:10.9px;font-weight:700;width:38px;flex:none;padding-top:2px;letter-spacing:.04em}
.wtag.REC{color:var(--mut2)}.wtag.LIVE{color:#d873a5}
.wx{font-size:14.2px}.wx .pt{color:var(--mut2)}
/* AH months in two columns */
.ah-months{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;align-items:start;margin-top:4px}
.ah-months>details.sub{border:1px solid var(--line);border-radius:11px;padding:0 12px}
.ah-months>details.sub>summary{padding:12px 2px}
/* Formulation parts in two columns */
.form-parts{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;align-items:start;margin-top:4px}
.form-parts>details.sub{border:1px solid var(--line);border-radius:11px;padding:0 12px}
.form-parts>details.sub>summary{padding:12px 2px}
.form-parts .sub-bar{max-width:none}
/* weekend-intensive block inside a module */
.intensive-block{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:8px 12px 10px;margin:4px 2px 10px}
.intensive-lab{font-weight:700;font-size:13.6px;color:var(--lav);margin:2px 0 2px}
.intensive-block .arow{grid-template-columns:150px 1fr}

/* internship */
.hours-summary{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:6px 2px 8px}
.hours-summary .bar-row{grid-template-columns:230px 1fr 120px;margin:9px 0}
.hours-cap{color:var(--mut);font-size:12.6px;margin-top:8px;font-style:italic}
.itab{width:100%;border-collapse:collapse;margin:6px 0 4px}
.itab th,.itab td{text-align:left;font-size:14.7px;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.itab th{color:var(--mut);font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.03em}
.itab td.hh{white-space:nowrap;font-weight:600}
.blocklab{font-weight:700;font-size:14.7px;color:var(--lav);margin:18px 2px 4px}
.opt{font-size:14.2px;color:var(--mut);padding:5px 2px;border-top:1px dashed var(--line)}
.opt b{color:var(--ink)}

.foot{display:flex;justify-content:space-between;align-items:center;margin-top:22px;
  color:var(--mut);font-size:14.2px;padding:0 4px;flex-wrap:wrap;gap:10px}
.foot-btns{display:flex;gap:8px;flex-wrap:wrap}
button.reset{font:inherit;font-size:14.2px;color:var(--mut);background:var(--card);
  border:1px solid var(--line);border-radius:9px;padding:7px 14px;cursor:pointer}
button.reset:hover{color:var(--lav);border-color:var(--lav)}
#backupBtn,#restoreBtn{color:var(--ink);font-weight:600}
/* modal */
.modal{display:none;position:fixed;inset:0;background:rgba(64,59,82,.34);
  align-items:center;justify-content:center;padding:20px;z-index:50}
.modal.open{display:flex}
.modal-card{background:var(--card);border:1px solid var(--line);border-radius:16px;
  box-shadow:0 12px 40px rgba(64,59,82,.25);max-width:460px;width:100%;padding:22px}
.modal-title{font-weight:700;font-size:18.5px;margin-bottom:6px}
.modal-note{color:var(--mut);font-size:14.7px;margin-bottom:12px}
#modalText{width:100%;height:104px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:13.1px;color:var(--ink);background:var(--card2);border:1px solid var(--line);
  border-radius:10px;padding:10px;line-height:1.4}
.modal-actions{display:flex;gap:8px;margin-top:12px}
#modalPrimary{color:#fff;background:var(--lav);border-color:var(--lav);font-weight:700}
#modalPrimary:hover{filter:brightness(.96);color:#fff}
.modal-msg{font-size:13.6px;color:var(--mint);margin-top:9px;min-height:16px;font-weight:600}
.modal-msg.err{color:var(--peach)}
/* timeline */
.tl-title{font-weight:700;font-size:17.4px;margin-bottom:2px}
.tl-note{color:var(--mut);font-size:14.2px;margin-bottom:14px}
.tl-scroll{overflow-x:auto;padding-bottom:4px}
.tl-grid{display:grid;grid-template-columns:44px repeat(12,minmax(58px,1fr));gap:5px;min-width:760px}
.tl-h{font-size:12.5px;font-weight:700;color:var(--mut);text-align:center;padding:2px 0}
.tl-y{font-size:14.7px;font-weight:700;color:var(--ink);display:flex;align-items:center}
.tl-cell{min-height:40px;border-radius:9px;background:#f2eff7;border:1px solid var(--line);
  padding:4px;display:flex;flex-direction:column;gap:3px}
.tl-cell.empty{background:#f7f5fb;border-style:dashed;border-color:#efeaf4}
.pilltl{font-size:11.4px;font-weight:700;line-height:1.15;border-radius:6px;padding:3px 5px;color:#4a4550}
.p-int{background:#cdeadd;color:#357a5a}       /* weekend intensive (livestream) - green */
.p-inperson{background:#f7cfa1;color:#8f571b} /* in person: module / practicum - orange */
.p-usintern{background:#f6c5c0;color:#a5453c} /* US internship - pastel red */
.p-india{background:#f6d0e6;color:#9c4c81}    /* india internship - pink */
.p-elec{background:#dcc9f2;color:#6a4aa0}      /* elective - purple */
.p-study{background:#d3e8f7;color:#37699a}     /* self-study / catch-up - sky */
.p-light{background:#eceaf2;color:var(--mut)} /* light / wind-down */
.p-end{background:#f6ea9e;color:#867216}      /* orientation & program milestone - pastel yellow */
.tl-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px}
.tl-leg{display:flex;align-items:center;gap:7px;font-size:13.6px;color:var(--mut)}
.tl-sw{width:16px;height:12px;border-radius:4px;flex:none}

@media(max-width:1160px){
  .ov-grid,.rings{flex-wrap:wrap;justify-content:center}
}
@media(max-width:640px){
  .bar-row{grid-template-columns:120px 1fr 96px}
  .sec-meta{display:none}
  .sec-bar{flex:1}
  .frow{grid-template-columns:1fr;gap:5px}
  .pbar-cols{grid-template-columns:1fr}
  .sub-bar{max-width:none}
  .ah-months,.form-parts{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>AAP — Study Dashboard</h1>
  <div class="sub">Advanced Ayurvedic Practitioner · 2026–2029 · Michelle Christy — every track in one place</div>

  <div class="card pad section" id="overview"></div>

  <div class="card pad section" id="timeline"></div>

  <div id="sections"></div>

  <div class="foot">
    <span>Progress syncs automatically across your devices. To move it to another device, use&nbsp;Back&nbsp;up&nbsp;→&nbsp;Restore.</span>
    <span class="foot-btns">
      <button class="reset" id="backupBtn">⭱ Back up</button>
      <button class="reset" id="restoreBtn">⭳ Restore</button>
      <button class="reset" id="resetBtn">Reset</button>
    </span>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-card">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-note" id="modalNote"></div>
    <textarea id="modalText" spellcheck="false"></textarea>
    <div class="modal-actions">
      <button class="reset" id="modalPrimary"></button>
      <button class="reset" id="modalClose">Close</button>
    </div>
    <div class="modal-msg" id="modalMsg"></div>
  </div>
</div>

// ---------- svg / bar helpers ----------
function ring(size,pct,color,val,sub,label,cnt){
  const pc=Math.max(0,Math.min(pct,100));
  const sw=size>120?11:9, R=size/2-sw-3, cx=size/2, C=2*Math.PI*R, off=C*(1-pc/100);
  const vf=size>120?33:25, pf=size>120?13:11;
  return `<div class="ring" style="width:${size+8}px">
   <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
     <circle cx="${cx}" cy="${cx}" r="${R}" fill="none" stroke="var(--tw)" stroke-width="${sw}"/>
     <circle cx="${cx}" cy="${cx}" r="${R}" fill="none" stroke="${color}" stroke-width="${sw}"
       stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"
       transform="rotate(-90 ${cx} ${cx})"/>
     <text class="rv" x="${cx}" y="${cx-2}" text-anchor="middle" dominant-baseline="middle" style="font-size:${vf}px">${val}</text>
     <text class="rp" x="${cx}" y="${cx+vf*0.62}" text-anchor="middle" style="font-size:${pf}px">${sub}</text>
   </svg>
   <div class="lab">${label}</div><div class="cnt">${cnt}</div></div>`;
}
function bar(label,done,total,color,note){
  const w=Math.min(pctOf(done,total),100);
  return `<div class="bar-row"><div class="bl">${label}</div>
    <div class="track"><div class="fill" style="width:${w}%;background:${color}"></div></div>
    <div class="bc">${note||(done+" / "+total)}</div></div>`;
}
function mini(label,done,total,color){
  const w=Math.min(pctOf(done,total),100);
  return `<div class="mini"><div class="ml"><span>${label}</span><b>${total?done+"/"+total:"—"}</b></div>
    <div class="track"><div class="fill" style="width:${w}%;background:${color}"></div></div></div>`;
}
// compact labelled bar (part rows); empty label -> 2-col
function pbar(label,done,total,color){
  const w=Math.min(pctOf(done,total),100);
  const lab=label?`<div class="pbl">${label}</div>`:'';
  return `<div class="pbar${label?'':' nolabel'}">${lab}
    <div class="track"><div class="fill" style="width:${w}%;background:${color}"></div></div>
    <div class="pbc">${done}/${total}</div></div>`;
}

// ---------- metrics ----------
const M={};
function modComplete(m){
  if(m.status==="done")return true;
  const det=DATA.moduleDetail[m.code]; if(!det)return false;
  let any=false,all=true;
  det.forEach(s=>s.items.forEach((it,i)=>{any=true;if(!on("m"+m.code+"-s"+s.num+"-i"+i))all=false;}));
  return any&&all;
}
function intensiveCounts(m){
  let d=0,t=0;
  (m.intensive||[]).forEach(dd=>['am','pm'].forEach(x=>{t++;if(on("m"+m.code+"-int-d"+dd.n+x))d++;}));
  return [d,t];
}
function moduleMiniCounts(m){
  const det=DATA.moduleDetail[m.code];
  const iv=intensiveCounts(m);
  if(m.status==="done"){
    const dc=DONE_COUNTS[m.code]||{read:1,rec:1,slide:1,test:1};
    return {rd:dc.read,rt:dc.read,ld:dc.rec,lt:dc.rec,sd:dc.slide,st:dc.slide,td:dc.test,tt:dc.test,ivd:iv[0],ivt:iv[1]};
  }
  if(!det)return {rd:0,rt:0,ld:0,lt:0,sd:0,st:0,td:0,tt:0,ivd:iv[0],ivt:iv[1]};
  let rd=0,rt=0,ld=0,lt=0,sd=0,st=0,td=0,tt=0;
  det.forEach(s=>s.items.forEach((it,i)=>{
    const c=on("m"+m.code+"-s"+s.num+"-i"+i);
    if(it.t==='read'){rt++;if(c)rd++;}
    else if(it.t==='lecture'){lt++;if(c)ld++;}
    else if(it.t==='slides'){st++;if(c)sd++;}
    else if(it.t==='test'){tt++;if(c)td++;}
  }));
  return {rd,rt,ld,lt,sd,st,td,tt,ivd:iv[0],ivt:iv[1]};
}
function fClassDone(part,ci){return on("f"+part+"-"+ci+"-pdf")&&on("f"+part+"-"+ci+"-rec");}
function sanClassDone(i){return on("san-"+i+"-pdf")&&on("san-"+i+"-rec");}

function computeAll(){
  M.modDone=0; M.modTotal=DATA.modules.length;
  DATA.modules.forEach(m=>{if(modComplete(m))M.modDone++;});
  // formulations — track CLASSES
  M.fClassD=0;M.fClassT=0;M.formParts={};
  DATA.formulations.forEach(p=>{let d=0,t=0;
    p.classes.forEach((c,ci)=>{t++;if(fClassDone(p.part,ci))d++;});
    M.formParts[p.part]=[d,t];M.fClassD+=d;M.fClassT+=t;});
  // sanskrit — track CLASSES
  M.sanD=0;M.sanT=DATA.sanskrit.length;
  DATA.sanskrit.forEach((c,i)=>{if(sanClassDone(i))M.sanD++;});
  // ah
  M.ahRecD=M.ahRecT=M.ahLiveD=M.ahLiveT=0;M.ahRecParts={};M.ahLiveParts={};M.ahMonth={};
  DATA.ah.forEach((mo,mi)=>{let md=0,mt=0;
    mo.weeks.forEach((w,wi)=>w.items.forEach((it,ii)=>{
      const c=on("ah-"+mi+"-"+wi+"-"+ii); mt++; if(c)md++;
      const pm=it.label.match(/Part (\d+)/),pn=pm?pm[1]:"?";
      if(it.live){M.ahLiveT++;if(c)M.ahLiveD++;(M.ahLiveParts[pn]=M.ahLiveParts[pn]||[0,0]);M.ahLiveParts[pn][1]++;if(c)M.ahLiveParts[pn][0]++;}
      else{M.ahRecT++;if(c)M.ahRecD++;(M.ahRecParts[pn]=M.ahRecParts[pn]||[0,0]);M.ahRecParts[pn][1]++;if(c)M.ahRecParts[pn][0]++;}
    }));
    M.ahMonth[mi]=[md,mt];});
  // assignments
  let cons=[]; for(let r=1;r<=ASSIGN.rogis;r++)ASSIGN.consultStages.forEach(s=>cons.push("as-c"+r+"-"+s[0]));
  let herb=[]; for(let n=1;n<=ASSIGN.herbSheets;n++)herb.push("as-hb-s"+n); herb.push("as-hb-sub");
  let form=[]; for(let n=1;n<=ASSIGN.formRecs;n++)form.push("as-fr-f"+n); form.push("as-fr-sub");
  let diss=["as-di-synopsis","as-di-submitted","as-di-approved"];
  [M.asConsD,M.asConsT]=countIds(cons); [M.asHerbD,M.asHerbT]=countIds(herb);
  [M.asFormD,M.asFormT]=countIds(form); [M.asDissD,M.asDissT]=countIds(diss);
  M.asD=M.asConsD+M.asHerbD+M.asFormD+M.asDissD;
  M.asT=M.asConsT+M.asHerbT+M.asFormT+M.asDissT;
  // internship — regular (500 req / 505 planned) + additional (250) = total (750)
  M.intRegDone=0; DATA.internship.hours.forEach(h=>{if(on(h[0]))M.intRegDone+=h[2];});
  M.intRegReq=500;
  M.intAddDone=0; DATA.internship.requirements.forEach(r=>{if(on(r[0]))M.intAddDone+=r[2];});
  M.intAddReq=250;
  M.intCombDone=M.intRegDone+M.intAddDone; M.intCombTot=750;
  // overall = mean of the seven track percentages
  const ps=[pctOf(M.modDone,M.modTotal),pctOf(M.fClassD,M.fClassT),
    pctOf(M.ahRecD+M.ahLiveD,M.ahRecT+M.ahLiveT),pctOf(M.sanD,M.sanT),
    pctOf(M.asD,M.asT),pctOf(M.intRegDone,M.intRegReq),pctOf(M.intAddDone,M.intAddReq)];
  M.overall=Math.round(ps.reduce((a,b)=>a+b,0)/ps.length);
}

  return assignSub("cons","Consultations",M.asConsD,M.asConsT,cons)

// ---------- targeted update on toggle ----------
function updateModuleCard(code){
  const m=DATA.modules.find(x=>x.code===code); if(!m)return;
  const minis=document.querySelector('[data-minis="'+code+'"]'); if(minis)minis.innerHTML=minisHTML(m);
  const pill=document.querySelector('[data-pill="'+code+'"]'); if(pill)pill.innerHTML=pillHTML(m);
}
function handleToggle(id){
  computeAll(); renderOverview(); refreshMeta();
  if(id[0]==='m'){
    const code=id.slice(1,4);
    const row=document.querySelector('[data-row="'+id+'"]'); if(row)row.classList.toggle('done-row',on(id));
    updateModuleCard(code);
  }else if(id[0]==='f'){
    const part=id.split('-')[0].slice(1),ci=id.split('-')[1];
    const a=M.formParts[part];
    const fb=document.querySelector('[data-fbar="'+part+'"]'); if(fb)fb.innerHTML=pbar("",a[0],a[1],C_FORM);
    const row=document.querySelectorAll('[data-k="form-'+part+'"] .frow')[ci]; if(row)row.classList.toggle('fdone',fClassDone(part,ci));
  }else if(id.slice(0,4)==='san-'){
    const i=+id.split('-')[1];
    const sb=document.querySelector('[data-sanbar]'); if(sb)sb.innerHTML=pbar("Classes complete",M.sanD,M.sanT,C_SAN);
    const row=document.querySelectorAll('#body-san .frow')[i]; if(row)row.classList.toggle('fdone',sanClassDone(i));
  }else if(id.slice(0,3)==='ah-'){
    const mi=id.split('-')[1];
    const ab=document.getElementById('ah-bars'); if(ab)ab.outerHTML=ahBars();
    const am=document.querySelector('[data-ahmeta="'+mi+'"]'); if(am){const a=M.ahMonth[mi];am.textContent=a[0]+"/"+a[1];}
  }else if(id.slice(0,3)==='as-'){
    let key='diss';
    if(id.slice(0,4)==='as-c')key='cons';
    else if(id.slice(0,5)==='as-hb')key='herb';
    else if(id.slice(0,5)==='as-fr')key='form';
    const counts={cons:[M.asConsD,M.asConsT],herb:[M.asHerbD,M.asHerbT],
                  form:[M.asFormD,M.asFormT],diss:[M.asDissD,M.asDissT]}[key];
    const b=document.querySelector('[data-asbar="'+key+'"]'); if(b)b.innerHTML=pbar("",counts[0],counts[1],C_AS);
    if(key==='cons'){
      const r=+id.slice(4).split('-')[0];
      const done=ASSIGN.consultStages.every(s=>on("as-c"+r+"-"+s[0]));
      const row=document.querySelectorAll('[data-k="as-cons"] .arow')[r-1]; if(row)row.classList.toggle('arowdone',done);
    }else{
      const cb=document.querySelector('input[data-id="'+id+'"]');
      const row=cb&&cb.closest('.arow'); if(row)row.classList.toggle('arowdone',on(id));
    }
  }else if(id.slice(0,3)==='int'){
    document.getElementById('body-int').innerHTML=renderInternship();
  }
}

document.addEventListener('change',e=>{

    state[cb.dataset.id]=cb.checked; save(); handleToggle(cb.dataset.id);

});

  }
});

// ---------- back up / restore (cross-device) ----------
function encodeState(){
  const keys=Object.keys(state).filter(k=>state[k]);
  return "AAP1:"+btoa(unescape(encodeURIComponent(JSON.stringify(keys))));
}
function decodeState(code){
  code=(code||"").trim();
  if(code.indexOf("AAP1:")===0)code=code.slice(5);
  const keys=JSON.parse(decodeURIComponent(escape(atob(code))));
  if(!Array.isArray(keys))throw new Error("bad");
  const ns={}; keys.forEach(k=>ns[k]=true); ns["m301-done"]=true; return ns;
}
const modal=document.getElementById('modal');
const mTitle=document.getElementById('modalTitle'),mNote=document.getElementById('modalNote'),
      mText=document.getElementById('modalText'),mPrimary=document.getElementById('modalPrimary'),
      mMsg=document.getElementById('modalMsg');
function closeModal(){modal.classList.remove('open');mMsg.textContent='';mMsg.className='modal-msg';}
document.getElementById('modalClose').addEventListener('click',closeModal);
modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});

document.getElementById('backupBtn').addEventListener('click',()=>{
  const n=Object.keys(state).filter(k=>state[k]).length;
  mTitle.textContent="Back up progress";
  mNote.innerHTML="Copy this code, then open the dashboard on your other device (your iCloud file syncs everywhere) and use <b>Restore</b>. "+n+" items checked.";
  mText.value=encodeState(); mText.readOnly=true;
  mPrimary.textContent="Copy code"; mMsg.textContent='';mMsg.className='modal-msg';
  modal.classList.add('open'); mText.focus(); mText.select();
  mPrimary.onclick=async()=>{
    mText.select();
    try{await navigator.clipboard.writeText(mText.value);mMsg.textContent="Copied to clipboard ✓";}
    catch(e){try{document.execCommand('copy');mMsg.textContent="Copied ✓";}
      catch(_){mMsg.textContent="Select the code above and copy manually.";}}
  };
});
document.getElementById('restoreBtn').addEventListener('click',()=>{
  mTitle.textContent="Restore progress";
  mNote.innerHTML="Paste a backup code from another device and load it. <b>This replaces the progress currently on this device.</b>";
  mText.value=""; mText.readOnly=false;
  mPrimary.textContent="Load progress"; mMsg.textContent='';mMsg.className='modal-msg';
  modal.classList.add('open'); mText.focus();
  mPrimary.onclick=()=>{
    try{const ns=decodeState(mText.value); state=ns; save(); build();
      mMsg.className='modal-msg'; mMsg.textContent="Loaded ✓"; setTimeout(closeModal,700);}
    catch(e){mMsg.className='modal-msg err'; mMsg.textContent="That code didn't read correctly — check you copied all of it.";}
  };
});

// ---------- init ----------
build();

</script>
<script id="aap-sync">
(function(){
  var DB="https://aap-dashboard-fa854-default-rtdb.firebaseio.com/aapState.json";
  var KEY="aapStudyDashV1", TKEY="aapStudyDashV1_ts";
  var pushT=null, booted=false;
  function localTs(){ return +(localStorage.getItem(TKEY)||0); }
  function setTs(t){ localStorage.setItem(TKEY, String(t)); }
  function pull(){
    fetch(DB,{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(d){
      if(!d||typeof d!=='object'||!d.ts||!d.state) return;
      if(d.ts>localTs()){
        localStorage.setItem(KEY, JSON.stringify(d.state));
        setTs(d.ts);
        location.reload();
      }
    }).catch(function(){});
  }
  function pushNow(){
    try{
      var st=localStorage.getItem(KEY)||'{}';
      var ts=Date.now(); setTs(ts);
      fetch(DB,{method:'PUT',body:JSON.stringify({state:JSON.parse(st),ts:ts}),keepalive:true}).catch(function(){});
    }catch(e){}
  }
  function schedulePush(){ if(!booted) return; clearTimeout(pushT); pushT=setTimeout(pushNow,900); }
  try{ if(typeof save==='function'){ var _s=save; save=function(){ _s.apply(this,arguments); schedulePush(); }; } }catch(e){}
  setTimeout(function(){ booted=true; },1500);
  ['change','click'].forEach(function(ev){ document.addEventListener(ev,function(){ booted=true; }, true); });
  pull();
  setInterval(pull, 15000);
